[bridge]
host = "0.0.0.0"
port = 8443
certfile = "config/private/server.crt"
keyfile = "config/private/server.key"

[panel]
id = "wyss-REEMPLAZAR"
token_sha256 = "REEMPLAZAR_CON_SHA256"
primary_entity = "light.living"
allowed_entities = ["light.living", "light.desk", "scene.movie"]

[devices]
provider = "tuya"

[[tuya.lights]]
entity_id = "light.living"
name = "Luz del living"
device_id_env = "WYSS_TUYA_LIVING_DEVICE_ID"
address = "192.168.1.50"
local_key_env = "WYSS_TUYA_LIVING_LOCAL_KEY"
version = 3.3

[[tuya.lights]]
entity_id = "light.desk"
name = "Luz del escritorio"
device_id_env = "WYSS_TUYA_DESK_DEVICE_ID"
address = "192.168.1.51"
local_key_env = "WYSS_TUYA_DESK_LOCAL_KEY"
version = 3.3

[[tuya.scenes]]
entity_id = "scene.movie"
name = "Cine"

[[tuya.scenes.steps]]
entity_id = "light.living"
brightness = 20
rgb = 16719872

[[tuya.scenes.steps]]
entity_id = "light.desk"
on = false

[home_assistant]
url = "http://homeassistant.local:8123"
token_env = "WYSS_HA_TOKEN"

[wyss]
url = "http://127.0.0.1:8000"
token_env = "WYSS_API_TOKEN"

[protocol_v2]
enabled = false
identity_db = "bridge/data/identities.sqlite3"
event_db = "bridge/data/events.sqlite3"
projection_db = "bridge/data/projections.sqlite3"
light_audit_db = "bridge/data/light-audit.sqlite3"
rate_limit = 12
heartbeat_seconds = 12.0
snapshot_fallback = false
lights_enabled = false
conversation_enabled = false
conversation_streaming = true
voice_enabled = false
voice_max_bytes = 4194304
voice_timeout_seconds = 30.0
spotify_enabled = false
spotify_approved_scopes = []
weather_enabled = false
weather_cache_db = "bridge/data/weather-cache.sqlite3"
weather_latitude = -27.4514
weather_longitude = -58.9867
weather_timezone = "America/Argentina/Cordoba"
weather_refresh_seconds = 1800
weather_max_stale_seconds = 21600
calendar_enabled = false
calendar_access = "disabled"
calendar_approved_scopes = []
calendar_cache_db = "bridge/data/calendar-cache.sqlite3"
calendar_timezone = "America/Argentina/Cordoba"
calendar_refresh_seconds = 300
reminders_enabled = false
reminder_cache_db = "bridge/data/reminder-cache.sqlite3"
reminder_timezone = "America/Argentina/Cordoba"
reminder_refresh_seconds = 60
notifications_enabled = false
notification_db = "bridge/data/notification-outbox.sqlite3"
timers_enabled = false
timer_cache_db = "bridge/data/timer-cache.sqlite3"
timer_notification_db = "bridge/data/timer-notification-outbox.sqlite3"
timer_refresh_seconds = 1
observability_enabled = false
observability_max_samples = 512
max_pending_events = 256
