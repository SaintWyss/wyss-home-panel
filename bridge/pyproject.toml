[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "wyss-home-panel-bridge"
version = "1.0.0"
description = "Yo conecto Wyss Home Panel con Wyss, Home Assistant y Tuya local."
readme = "README.md"
requires-python = ">=3.12"
license = {text = "Apache-2.0"}
dependencies = [
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "pyserial>=3.5,<4",
  "pydantic>=2.11,<3",
  "tinytuya>=1.17,<2",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.12,<1",
]

[project.scripts]
wyss-panel-bridge = "wyss_panel_bridge.api:main"
wyss-firmware-release = "wyss_panel_bridge.operations.firmware_release:main"

[tool.hatch.build.targets.wheel]
packages = ["src/wyss_panel_bridge"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S"]
ignore = ["S104"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["wyss_panel_bridge"]
