[platformio]
default_envs = waveshare_esp32_s3_touch_lcd_7
src_dir = firmware/src
include_dir = firmware/include
lib_dir = firmware/lib
data_dir = firmware/data
test_dir = firmware/test

[env:waveshare_esp32_s3_touch_lcd_7]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/51.03.07/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
board_build.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
monitor_speed = 115200
lib_ldf_mode = deep+
lib_archive = false
lib_deps =
    https://github.com/esp-arduino-libs/esp-lib-utils.git#971e06143ac2d3ad41da22ba673b34b949e7bf03
    https://github.com/esp-arduino-libs/ESP32_IO_Expander.git#61fbf44ed3fbbcb383b26731f389ca0f0e622f91
    https://github.com/esp-arduino-libs/ESP32_Display_Panel.git#a5007cc2bcee5c0a730884a288a6d20df7b67fdd
    lvgl/lvgl@8.4.0
    bblanchon/ArduinoJson@7.3.1
    links2004/WebSockets@2.6.1
build_unflags =
    -std=gnu++11
    -std=gnu++17
    -Os
build_flags =
    -std=gnu++20
    -O2
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DLV_CONF_INCLUDE_SIMPLE
    -DWYSS_PROTOCOL_V2_CLIENT=1
    -DWYSS_ENABLE_PROTOCOL_V2=1
    -I firmware/include
    -I ${platformio.packages_dir}/framework-arduinoespressif32/libraries/Network/src
    -I ${platformio.packages_dir}/framework-arduinoespressif32/libraries/NetworkClientSecure/src
    -I ${platformio.packages_dir}/framework-arduinoespressif32/libraries/WiFi/src
    -Wall
    -Wextra
check_tool = clangtidy
check_flags =
    clangtidy: --checks=-*,bugprone-*,performance-*,portability-*

[env:native]
platform = native
test_framework = unity
build_flags =
    -std=c++20
    -O2
    -Wall
    -Wextra
    -Werror
    -I firmware/include
test_filter = test_domain
