name: Yo valido el producto

on:
  push:
    branches: [main, "agent/**"]
  pull_request:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  domain:
    name: Yo pruebo el dominio C++
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --parallel
      - run: ctest --test-dir build --output-on-failure

  bridge:
    name: Yo valido el puente Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: bridge/pyproject.toml
      - run: python -m pip install -e 'bridge[dev]'
      - run: ruff check bridge
      - run: ruff format --check bridge
      - run: mypy bridge/src
      - run: pytest bridge/tests --quiet

  firmware:
    name: Yo compilo el firmware ESP32-S3
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install platformio
      - run: pio run -e waveshare_esp32_s3_touch_lcd_7

  secrets:
    name: Yo busco secretos accidentales
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
