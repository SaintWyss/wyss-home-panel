name: Yo valido el producto

on:
  push:
    branches: [main, "agent/**"]
  pull_request:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  domain:
    name: Yo pruebo el dominio C++
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build --parallel
      - run: ctest --test-dir build --output-on-failure

  bridge:
    name: Yo valido el puente Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install uv==0.11.18
      - run: uv sync --project bridge --locked --extra dev
      - run: uv run --project bridge --locked --extra dev ruff check bridge tools/check_docs.py tools/doctor.py tools/probe_light.py tools/check_baseline_evidence.py tools/check_ci_protection.py tools/check_architecture.py tools/check_requirement_evidence.py tools/generate_sbom.py tools/prepare_release.py
      - run: uv run --project bridge --locked --extra dev ruff format --check bridge tools/check_docs.py tools/doctor.py tools/probe_light.py tools/check_baseline_evidence.py tools/check_ci_protection.py tools/check_architecture.py tools/check_requirement_evidence.py tools/generate_sbom.py tools/prepare_release.py
      - run: uv run --project bridge --locked --extra dev mypy bridge/src
      - run: uv run --project bridge --locked --extra dev python tools/check_architecture.py --format json
      - run: uv run --project bridge --locked --extra dev python tools/check_requirement_evidence.py --format json
      - run: uv run --project bridge --locked --extra dev pytest bridge/tests --quiet
      - run: uv export --project bridge --locked --no-emit-project --format requirements-txt --output-file /tmp/wyss-requirements.txt
      - run: uvx --from pip-audit==2.10.1 pip-audit --requirement /tmp/wyss-requirements.txt --strict --progress-spinner off
      - run: python tools/generate_sbom.py --output /tmp/wyss-home-panel.cdx.json

  firmware:
    name: Yo compilo el firmware ESP32-S3
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install platformio==6.1.19
      - run: pio run -e waveshare_esp32_s3_touch_lcd_7

  secrets:
    name: Yo busco secretos accidentales
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false

  docs:
    name: Yo valido documentación esencial
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python tools/check_docs.py --format json
      - run: python tools/check_requirement_evidence.py --format json
