name: Aplicar interfaz de referencia

on:
  push:
    branches: ["feat/panel-ui-reference-fidelity"]
    paths:
      - "tools/apply_reference_ui.py"
      - ".github/workflows/apply-reference-ui.yml"
      - "firmware/src/adapters/lvgl_panel_view.cpp"
      - "firmware/include/wyss/ui/design_tokens.hpp"
      - "tests/fixtures/ui_visual_manifest.txt"
  pull_request:
    paths:
      - "tools/apply_reference_ui.py"
      - ".github/workflows/apply-reference-ui.yml"
      - "firmware/src/adapters/lvgl_panel_view.cpp"
      - "firmware/include/wyss/ui/design_tokens.hpp"
      - "tests/fixtures/ui_visual_manifest.txt"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: feat/panel-ui-reference-fidelity
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
      - name: Aplicar transformación visual
        run: |
          if grep -q "MEDIA: composición clara" firmware/src/adapters/lvgl_panel_view.cpp; then
            echo "La transformación ya está aplicada"
          else
            python tools/apply_reference_ui.py
          fi
      - name: Instalar toolchain fijado
        run: |
          python -m pip install platformio==6.1.19
          pio pkg install -e waveshare_esp32_s3_touch_lcd_7
      - name: Compilar dominio y simulador
        run: |
          cmake -S . -B build-ui -DCMAKE_BUILD_TYPE=Release
          cmake --build build-ui --parallel
          ctest --test-dir build-ui --output-on-failure -E ui_visual_tests
      - name: Regenerar evidencia visual exacta
        run: |
          ./build-ui/ui_simulator --output-dir build-ui/ui-snapshots | tee /tmp/ui-hashes.txt
          awk 'NF == 2 && $1 != "lvgl_free_bytes" { print $1 " " $2 }' /tmp/ui-hashes.txt > tests/fixtures/ui_visual_manifest.txt
          ./build-ui/ui_simulator --output-dir build-ui/ui-snapshots --verify tests/fixtures/ui_visual_manifest.txt
      - name: Compilar firmware ESP32-S3
        run: pio run -e waveshare_esp32_s3_touch_lcd_7
      - name: Guardar implementación verificada
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add firmware/include/wyss/ui/design_tokens.hpp \
                  firmware/src/adapters/lvgl_panel_view.cpp \
                  tests/fixtures/ui_visual_manifest.txt
          if ! git diff --cached --quiet; then
            git commit -m "feat(panel): igualar interfaz a referencias del owner [skip ci]"
            git push origin HEAD:feat/panel-ui-reference-fidelity
          fi
