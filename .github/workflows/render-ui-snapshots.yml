name: Exportar pantallas reales de Wyss Home

on:
  pull_request:
    paths:
      - ".github/workflows/render-ui-snapshots.yml"
      - "simulator/**"
      - "firmware/**"
      - "tests/fixtures/ui_visual_manifest.txt"
      - "CMakeLists.txt"

permissions:
  contents: read

jobs:
  render:
    name: Renderizar pantallas LVGL
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install platformio==6.1.19
      - run: pio pkg install -e waveshare_esp32_s3_touch_lcd_7
      - run: cmake -S . -B build-ui -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build-ui --target ui_simulator --parallel
      - run: ./build-ui/ui_simulator --output-dir ui-snapshots
      - run: tar -czf wyss-home-ui-snapshots.tar.gz ui-snapshots
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wyss-home-ui-snapshots
          path: wyss-home-ui-snapshots.tar.gz
          if-no-files-found: error
          retention-days: 1
