name: Exportar pantallas reales de Wyss Home

on:
  pull_request:
    paths:
      - ".github/workflows/render-ui-snapshots.yml"
      - "simulator/**"
      - "firmware/**"
      - "tests/fixtures/ui_visual_manifest.txt"
      - "CMakeLists.txt"
      - "rendered-ui/**"

permissions:
  contents: write

jobs:
  render:
    name: Renderizar pantallas LVGL
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --quiet platformio==6.1.19 pillow==11.3.0
      - run: pio pkg install -e waveshare_esp32_s3_touch_lcd_7
      - run: cmake -S . -B build-ui -DCMAKE_BUILD_TYPE=Release
      - run: cmake --build build-ui --target ui_simulator --parallel
      - run: ./build-ui/ui_simulator --output-dir ui-snapshots
      - name: Convertir y agrupar capturas
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw, ImageFont

          source = Path("ui-snapshots")
          output = Path("rendered-ui")
          output.mkdir(exist_ok=True)
          files = sorted(source.glob("*.ppm"))
          if not files:
              raise SystemExit("el simulador no generó capturas")

          font = ImageFont.load_default()
          thumbs = []
          for path in files:
              image = Image.open(path).convert("RGB")
              png_path = output / f"{path.stem}.png"
              image.save(png_path, optimize=True)
              thumb = image.resize((400, 240), Image.Resampling.LANCZOS)
              tile = Image.new("RGB", (400, 268), "#111318")
              tile.paste(thumb, (0, 28))
              draw = ImageDraw.Draw(tile)
              draw.text((8, 8), path.stem, fill="white", font=font)
              thumbs.append(tile)

          columns = 2
          rows = (len(thumbs) + columns - 1) // columns
          sheet = Image.new("RGB", (columns * 400, rows * 268), "#090b10")
          for index, tile in enumerate(thumbs):
              sheet.paste(tile, ((index % columns) * 400, (index // columns) * 268))
          sheet.save(output / "wyss-home-current-screens.jpg", quality=82, optimize=True)
          PY
      - name: Guardar capturas en la rama temporal
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rendered-ui
          if ! git diff --cached --quiet; then
            git commit -m "chore: adjuntar pantallas actuales de Wyss Home [skip ci]"
            git push origin HEAD:${{ github.head_ref }}
          fi
