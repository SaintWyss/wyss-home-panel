name: Empaquetar vista previa de Wyss Home

on:
  pull_request:
    paths:
      - ".github/workflows/package-ui-preview.yml"
      - "rendered-ui/**"

permissions:
  contents: write

jobs:
  package:
    name: Empaquetar vista previa
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet pillow==11.3.0
      - name: Crear miniatura real paginable
        run: |
          python - <<'PY'
          import base64
          from pathlib import Path
          from PIL import Image, ImageDraw, ImageFont

          source = Path("rendered-ui")
          output = Path("rendered-ui-preview")
          output.mkdir(exist_ok=True)

          files = sorted(
              path for path in source.glob("*.png")
              if path.name != "wyss-home-current-screens.png"
          )
          if not files:
              raise SystemExit("faltan las capturas PNG renderizadas")

          font = ImageFont.load_default()
          tiles = []
          for path in files:
              image = Image.open(path).convert("RGB")
              thumb = image.resize((150, 90), Image.Resampling.LANCZOS)
              tile = Image.new("RGB", (150, 104), "#111318")
              ImageDraw.Draw(tile).text((3, 2), path.stem, fill="white", font=font)
              tile.paste(thumb, (0, 14))
              tiles.append(tile)

          columns = 2
          rows = (len(tiles) + columns - 1) // columns
          sheet = Image.new("RGB", (300, rows * 104), "#090b10")
          for index, tile in enumerate(tiles):
              sheet.paste(tile, ((index % columns) * 150, (index // columns) * 104))

          preview = output / "wyss-home-current-screens-tiny.jpg"
          sheet.save(preview, quality=18, optimize=True, progressive=True, subsampling=2)
          encoded = base64.b64encode(preview.read_bytes()).decode("ascii")
          line_size = 1000
          lines = [encoded[i:i + line_size] for i in range(0, len(encoded), line_size)]
          (output / "base64-wrapped.txt").write_text("\n".join(lines) + "\n", encoding="ascii")
          (output / "manifest.txt").write_text(
              "\n".join([
                  f"filename={preview.name}",
                  f"base64_length={len(encoded)}",
                  f"lines={len(lines)}",
                  f"line_size={line_size}",
              ]) + "\n",
              encoding="utf-8",
          )
          PY
      - name: Guardar paquete temporal
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rendered-ui-preview
          if ! git diff --cached --quiet; then
            git commit -m "chore: reducir vista previa real [skip ci]"
            git push origin HEAD:${{ github.head_ref }}
          fi
