name: Aplicar check manual de puerta

on:
  push:
    branches: ["feat/manual-door-check"]
    paths:
      - "tools/apply_manual_door_check.py"
      - "tools/fix_manual_door_script.py"
      - ".github/workflows/apply-manual-door-check.yml"
      - "firmware/**"
      - "tests/**"
      - "README.md"
  pull_request:
    paths:
      - "tools/apply_manual_door_check.py"
      - "tools/fix_manual_door_script.py"
      - ".github/workflows/apply-manual-door-check.yml"
      - "firmware/**"
      - "tests/**"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: feat/manual-door-check
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
      - name: Aplicar implementación
        run: |
          if grep -q "Check manual diario" firmware/src/adapters/lvgl_panel_view.cpp; then
            echo "La implementación ya está aplicada"
          else
            set +e
            python tools/fix_manual_door_script.py > /tmp/apply-door.log 2>&1
            status=$?
            if [ "$status" -eq 0 ]; then
              python tools/apply_manual_door_check.py >> /tmp/apply-door.log 2>&1
              status=$?
            fi
            set -e
            if [ "$status" -ne 0 ]; then
              cp /tmp/apply-door.log docs/evidence/manual-door-check-error.txt
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
              git add docs/evidence/manual-door-check-error.txt
              git commit -m "chore(panel): capturar error del check de puerta"
              git push origin HEAD:feat/manual-door-check
              cat /tmp/apply-door.log
              exit "$status"
            fi
          fi
      - name: Instalar toolchain fijado
        run: |
          python -m pip install platformio==6.1.19
          pio pkg install -e waveshare_esp32_s3_touch_lcd_7
      - name: Compilar dominio y ejecutar pruebas
        run: |
          cmake -S . -B build-door -DCMAKE_BUILD_TYPE=Release
          cmake --build build-door --parallel
          ctest --test-dir build-door --output-on-failure -E ui_visual_tests
      - name: Regenerar evidencia visual
        run: |
          ./build-door/ui_simulator --output-dir build-door/ui-snapshots | tee /tmp/ui-hashes.txt
          awk 'NF == 2 && $1 != "lvgl_free_bytes" { print $1 " " $2 }' /tmp/ui-hashes.txt > tests/fixtures/ui_visual_manifest.txt
          ./build-door/ui_simulator --output-dir build-door/ui-snapshots --verify tests/fixtures/ui_visual_manifest.txt
      - name: Compilar firmware ESP32-S3
        run: pio run -e waveshare_esp32_s3_touch_lcd_7
      - name: Guardar implementación verificada
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md \
                  firmware/include/wyss/domain/types.hpp \
                  firmware/include/wyss/ports/ports.hpp \
                  firmware/include/wyss/application/panel_service.hpp \
                  firmware/include/wyss/adapters/lvgl_panel_view.hpp \
                  firmware/include/wyss/adapters/arduino_local_time.hpp \
                  firmware/include/wyss/adapters/nvs_door_check_store.hpp \
                  firmware/src/application/panel_service.cpp \
                  firmware/src/adapters/lvgl_panel_view.cpp \
                  firmware/src/main.cpp \
                  tests/domain_tests.cpp \
                  tests/fixtures/ui_visual_manifest.txt
          if ! git diff --cached --quiet; then
            git commit -m "feat(panel): agregar check diario persistente de puerta"
            git push origin HEAD:feat/manual-door-check
          fi
